name: Deploy - Production - LP Zeonpaper

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ vars.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.PROD_S3_BUCKET_REGION }}

      # 1. Assets (imagens, icones, etc): cache no navegador/CDN.
      # Roda primeiro, com --delete, para limpar assets removidos.
      # Os .html sao excluidos aqui e preservados (nao sao apagados).
      - name: Deploy assets para S3 (cache longo)
        run: |
          aws s3 sync . s3://${{ vars.PROD_S3_BUCKET }}/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "docs/*" \
            --exclude ".gitignore" \
            --exclude "*.html" \
            --cache-control "public,max-age=604800"

      # 2. HTML: sempre revalida, para que mudancas apareçam no proximo acesso.
      # O --exclude "docs/*" vem DEPOIS do --include para que o include
      # recursivo de *.html nao reinclua os HTML internos de docs/.
      - name: Deploy HTML para S3 (sem cache)
        run: |
          aws s3 sync . s3://${{ vars.PROD_S3_BUCKET }}/ \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --exclude "docs/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.PROD_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
